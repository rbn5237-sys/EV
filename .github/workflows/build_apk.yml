name: Build APK

on:
  push:
    branches: [ local-sync ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate launcher icons
        run: |
          # generate adaptive icons from assets/icon (flutter_launcher_icons)
          flutter pub run flutter_launcher_icons:main || true

      - name: Set app display name (if flutter_launcher_name present)
        run: |
          flutter pub run flutter_launcher_name:main || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
