name: Build APK

on:
  push:
    branches: [ local-sync ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Android SDK command-line tools and platforms
        run: |
          set -e
          export ANDROID_SDK_ROOT="$HOME/Android/Sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O /tmp/cmdline.zip
          unzip -q /tmp/cmdline.zip -d /tmp/cmdline
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/" || true
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Ensure platform folders
        run: |
          # Create Android/iOS platform folders if missing so build can run
          flutter create . || true

      - name: Flutter pub get
        run: flutter pub get


      - name: Decode placeholder icons (base64 -> png)
        run: |
          # Always decode/overwrite placeholder PNGs from .b64 to ensure valid PNGs
          if [ -f assets/icon/app_icon.png.b64 ]; then
            base64 --decode assets/icon/app_icon.png.b64 > assets/icon/app_icon.png || true
          fi
          if [ -f assets/icon/app_icon_foreground.png.b64 ]; then
            base64 --decode assets/icon/app_icon_foreground.png.b64 > assets/icon/app_icon_foreground.png || true
          fi

      - name: Generate launcher icons
        run: |
          flutter pub run flutter_launcher_icons:main || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/*.apk
