<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="100%" height="100%" fill="#f7f9ff"/>
  <rect x="0" y="0" width="100%" height="220" fill="#0b3d91"/>
  <text x="60" y="130" font-family="Segoe UI, Roboto, Arial" font-size="36" fill="#ffffff">Dashboard</text>

  <!-- Top cards -->
  <g transform="translate(48,260)">
    <g>
      <rect x="0" y="0" width="980" height="140" rx="20" fill="#ffffff" stroke="#e6e9ff"/>
      <text x="40" y="48" font-family="Segoe UI" font-size="18" fill="#263238">Total Students</text>
      <text x="40" y="98" font-family="Segoe UI" font-size="36" fill="#0b3d91" font-weight="700">120</text>
      <text x="900" y="90" font-family="Segoe UI" font-size="14" fill="#6b6f86" text-anchor="end">Updated • Today</text>
    </g>
  </g>

  <!-- Quick tiles -->
  <g transform="translate(48,440)">
    <rect x="0" y="0" width="460" height="260" rx="18" fill="#ffffff" stroke="#eef1ff"/>
    <text x="30" y="46" font-family="Segoe UI" font-size="20" fill="#0b3d91">Classes</text>
    <text x="30" y="100" font-family="Segoe UI" font-size="32" fill="#3f51b5">12</text>

    <rect x="520" y="0" width="460" height="260" rx="18" fill="#ffffff" stroke="#eef1ff"/>
    <text x="640" y="46" font-family="Segoe UI" font-size="20" fill="#0b3d91">Export</text>
    <text x="640" y="100" font-family="Segoe UI" font-size="18" fill="#3f51b5">PDF • JSON • Share</text>
  </g>

  <!-- Recent contacts sample (Pakistan) -->
  <g transform="translate(48,740)">
    <text x="0" y="0" font-family="Segoe UI" font-size="18" fill="#263238">Recent Contacts</text>
    <g transform="translate(0,24)">
      <rect x="0" y="16" width="980" height="110" rx="14" fill="#ffffff" stroke="#eef1ff"/>
      <text x="92" y="74" font-family="Segoe UI" font-size="22" fill="#0b3d91">Ali Ahmed</text>
      <text x="92" y="102" font-family="Segoe UI" font-size="14" fill="#6b6f86">+92 300 1234567 • Roll 01 • Grade 1</text>
    </g>

    <g transform="translate(0,140)">
      <rect x="0" y="16" width="980" height="110" rx="14" fill="#fff8e1" stroke="#fff2cc"/>
      <text x="92" y="74" font-family="Segoe UI" font-size="22" fill="#bf360c">Sara Khan</text>
      <text x="92" y="102" font-family="Segoe UI" font-size="14" fill="#6b6f86">+92 300 7654321 • Roll 02 • Grade 1</text>
    </g>
  </g>

  <text x="540" y="1860" font-family="Segoe UI" font-size="16" fill="#9e9e9e" text-anchor="middle">Local sample data uses +92 phone codes and Pakistani names</text>
</svg>