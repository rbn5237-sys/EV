<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="100%" height="100%" fill="#f2f6ff"/>
  <rect x="0" y="0" width="100%" height="140" fill="#0b3d91"/>
  <text x="60" y="90" font-family="Segoe UI" font-size="32" fill="#fff">Student • Roll 01</text>

  <g transform="translate(48,180)">
    <rect x="0" y="0" width="984" height="420" rx="18" fill="#ffffff" stroke="#eef1ff"/>
    <text x="40" y="64" font-family="Segoe UI" font-size="26" fill="#0b3d91">Name: Ali Ahmed</text>
    <text x="40" y="108" font-family="Segoe UI" font-size="18" fill="#6b6f86">Father: Muhammad Akram</text>
    <text x="40" y="150" font-family="Segoe UI" font-size="18" fill="#6b6f86">Contact: +92 300 1234567</text>
    <text x="40" y="192" font-family="Segoe UI" font-size="18" fill="#6b6f86">Address: Gulberg, Lahore</text>
    <text x="40" y="236" font-family="Segoe UI" font-size="18" fill="#6b6f86">Comments: Regular, good attendance</text>

    <!-- Color tag examples -->
    <g transform="translate(40,280)">
      <rect x="0" y="0" width="120" height="40" rx="10" fill="#c5e1a5"/>
      <text x="60" y="26" font-family="Segoe UI" font-size="14" fill="#2e7d32" text-anchor="middle">Good</text>

      <rect x="140" y="0" width="120" height="40" rx="10" fill="#fff59d"/>
      <text x="200" y="26" font-family="Segoe UI" font-size="14" fill="#f57f17" text-anchor="middle">Average</text>

      <rect x="280" y="0" width="120" height="40" rx="10" fill="#ffccbc"/>
      <text x="340" y="26" font-family="Segoe UI" font-size="14" fill="#bf360c" text-anchor="middle">Needs Help</text>
    </g>

    <!-- Action buttons -->
    <g transform="translate(40,340)">
      <rect x="0" y="0" width="420" height="70" rx="14" fill="#0b3d91"/>
      <text x="210" y="44" font-family="Segoe UI" font-size="20" fill="#fff" text-anchor="middle">Save</text>

      <rect x="480" y="0" width="420" height="70" rx="14" fill="#d32f2f"/>
      <text x="690" y="44" font-family="Segoe UI" font-size="20" fill="#fff" text-anchor="middle">Delete</text>
    </g>
  </g>

  <text x="540" y="1820" font-family="Segoe UI" font-size="16" fill="#9e9e9e" text-anchor="middle">Contact actions: Call / SMS / WhatsApp (Pakistan +92)</text>
</svg>